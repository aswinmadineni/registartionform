
<!DOCTYPE html>
<html>
<head>
    <title> welcome everyoneUser Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }
        .form {
            width: 300px;
            margin: 80px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form">
    <h2>User Registration</h2>

    <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <input type="tel" placeholder="Phone Number" required>
        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
